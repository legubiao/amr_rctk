# 巡逻节点配置文件
# 定义巡逻点和控制参数

patrol_node:
  ros__parameters:
    # 巡逻点X坐标列表（单位：米）
    waypoints_x: [0.0, 2.0, 2.0, 0.0]
    
    # 巡逻点Y坐标列表（单位：米）
    waypoints_y: [0.0, 0.0, 2.0, 2.0]
    
    # 巡逻点目标朝向（单位：弧度，0=朝向X轴正方向，逆时针为正）
    # 可选参数，如果不设置，默认为0
    # 示例：0.0=向东, 1.57=向北, 3.14=向西, -1.57=向南
    waypoints_yaw: [0.0, 1.57, 3.14, -1.57]
    
    # 是否重复巡逻（true: 循环巡逻, false: 巡逻一次后停止）
    repeat_patrol: true
    
    # 到达目标点的距离容差（单位：米）
    goal_tolerance: 0.2
    
    # 角度容差（单位：弧度）
    angular_tolerance: 0.1
    
    # 线速度参考值（单位：米/秒）
    linear_velocity: 0.3
    
    # 角速度参考值（单位：弧度/秒）
    angular_velocity: 0.5
    
    # 线速度比例控制增益
    kp_linear: 1.0
    
    # 角速度比例控制增益
    kp_angular: 2.0
    
    # 最大线速度限制（单位：米/秒）
    max_linear_vel: 0.5
    
    # 最大角速度限制（单位：弧度/秒）
    max_angular_vel: 1.0

